# Cloudflare Tunnel 部署。应用不发布任何端口，cloudflared 主动连接 Cloudflare，服务器不需要入站端口、Nginx 和证书。
# 下载为部署目录的 compose.yaml，和 .env 放在一起（见 docs/25-cloudflare-tunnel.md）。
#   docker compose up -d
# 更新（先备份）：
#   docker compose pull
#   docker compose up -d
# 项目名固定，不随部署目录变化
name: sub-forge
services:
  sub-forge:
    image: ${SUBFORGE_IMAGE:?请在 .env 中设置 Docker Hub 镜像，例如 your-name/sub-forge:latest}
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?请在 .env 中设置对外 HTTPS 地址}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?请在 .env 中设置浏览器访问的来源，通常与 PUBLIC_URL 相同}
      # 只信任下面 cloudflared 的固定地址，由它转发 Cloudflare 写入的 X-Forwarded-For
      SUBFORGE_TRUSTED_PROXIES: 172.30.81.2
      TZ: ${TZ:-UTC}
      SUBFORGE_ADMIN_USERNAME: ${SUBFORGE_ADMIN_USERNAME:-}
      SUBFORGE_ADMIN_PASSWORD: ${SUBFORGE_ADMIN_PASSWORD:-}
    volumes:
      # 数据库和密钥放在宿主机目录，容器以 UID 1000 运行，目录须提前创建并授权
      - ${SUBFORGE_DATA_DIR:-./data}:/data
    networks:
      tunnel:
        # 应用先启动，动态分配会占用 .2，导致 cloudflared 起不来，所以两边都固定
        ipv4_address: 172.30.81.3
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?请在 .env 中设置 Cloudflare Tunnel 令牌}
    depends_on:
      sub-forge:
        condition: service_healthy
    networks:
      tunnel:
        ipv4_address: 172.30.81.2
networks:
  tunnel:
    ipam:
      config:
        # 网段不得与服务器上现有的 Docker 网络冲突
        - subnet: 172.30.81.0/24
