mode: rule
dns:
  nameserver:
    - https://doh.pub/dns-query
proxies:
  - name: 香港节点
    type: trojan
    server: hk.example.test
    port: 443
    password: example
  - name: 日本节点
    type: hysteria2
    server: jp.example.test
    port: 443
    auth: hy2-example
proxy-groups:
  - name: 代理
    type: select
    proxies:
      - 香港节点
      - 日本节点
rules:
  - DOMAIN,paypal.test,代理
  - USER-AGENT,PayPal*,代理
  - DOMAIN-REGEX,^example\.test$,代理
  - IP-CIDR,192.0.2.0/24,代理,no-resolve
  - MATCH,DIRECT
