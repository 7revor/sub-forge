#!FORBIDDEN-AUTO-UPGRADE smart-group
[General]
loglevel = notify
test-timeout = 0
dns-server = system, 1.1.1.1

[Host]
local.example.test = 192.0.2.1
[Proxy]
香港 = trojan, hk.example.test, 443, password="example", test-url=http://example.test/204, test-timeout=5
日本 = hysteria2, jp.example.test, 443, password="example", salamander-password="example-obfs", download-bandwidth=100, test-url=http://example.test/204, test-timeout=5

[Proxy Group]
代理 = select, 香港, 日本
自动测速 = url-test, 香港, 日本, interval=300
故障转移 = fallback, 香港, 日本, interval=300
负载均衡 = load-balance, 香港, 日本, interval=300, persistent=true

[Rule]
DOMAIN,example.test,代理
IP-CIDR,192.0.2.0/24,代理,no-resolve
AND,((DOMAIN-SUFFIX,example.test),(DEST-PORT,443)),代理
USER-AGENT,Example*,代理
URL-REGEX,^https://example[.]test,代理
DOMAIN,extended.test,代理,extended-matching
FINAL,DIRECT
