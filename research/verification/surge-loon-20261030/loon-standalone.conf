[General]
ip-mode = v4-only
allow-wifi-access = false
test-timeout = 5
dns-server = system, 1.1.1.1
[Proxy]
香港 = trojan, hk.example.test, 443, "example", transport=tcp
日本 = hysteria2, jp.example.test, 443, "example", salamander-password="example-obfs", download-bandwidth=100

[Proxy Group]
代理 = select, 香港, 日本
自动测速 = url-test, 香港, 日本, url=http://example.test/204, interval=300
故障转移 = fallback, 香港, 日本, url=http://example.test/204, interval=300, max-timeout=5000
负载均衡 = load-balance, 香港, 日本, url=http://example.test/204, interval=300, max-timeout=5000, algorithm=PCC

[Rule]
DOMAIN,example.test,代理
IP-CIDR,192.0.2.0/24,代理,no-resolve
AND,((DOMAIN-SUFFIX,example.test),(DEST-PORT,443)),代理
USER-AGENT,Example*,代理
URL-REGEX,^https://example[.]test,代理
FINAL,DIRECT
