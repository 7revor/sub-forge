#!FORBIDDEN-AUTO-UPGRADE smart-group
[General]
dns-server = 223.5.5.5
ipv6 = false
always-real-ip = real.example.test
http-listen = 127.0.0.1:7890
socks5-listen = 127.0.0.1:7891
proxy-test-url = http://example.test/204
test-timeout = 3

[Host]
home.example.test = 192.0.2.1
dns.example.test = server:1.1.1.1
[Proxy]
入口 = ss, entry.example.test, 443, encrypt-method=aes-128-gcm, password="example"
落地 = ss, exit.example.test, 443, encrypt-method=aes-128-gcm, password="example", block-quic=on, underlying-proxy=入口

[Proxy Group]
代理 = select, 入口, 落地

[Rule]
FINAL,DIRECT
