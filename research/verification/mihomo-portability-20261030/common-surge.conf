# 虚构节点，仅用于验证格式；各客户端基础设置需另外配置。
#!FORBIDDEN-AUTO-UPGRADE smart-group

[Proxy]
SS 示例 = ss, node.example.test, 443, encrypt-method=aes-128-gcm, password="example"
VMess 示例 = vmess, node.example.test, 443, username=0233d11c-15a4-47d3-ade3-48ffca0ce119, tls=true, vmess-aead=true, ws=true, ws-path=/ws, ws-headers="Host:cdn.example.test"
Trojan 示例 = trojan, node.example.test, 443, password="example", sni=tls.example.test, alpn="h2,http/1.1", skip-cert-verify=false

[Proxy Group]
代理 = select, SS 示例, VMess 示例, Trojan 示例

[Rule]
DOMAIN,ads.example.test,REJECT
DOMAIN-SUFFIX,example.test,代理
IP-CIDR,192.0.2.0/24,DIRECT,no-resolve
FINAL,代理
