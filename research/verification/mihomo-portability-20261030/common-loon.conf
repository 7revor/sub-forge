# 虚构节点，仅用于验证格式；各客户端基础设置需另外配置。
[Proxy]
SS 示例 = Shadowsocks, node.example.test, 443, aes-128-gcm, "example"
VMess 示例 = vmess, node.example.test, 443, auto, "0233d11c-15a4-47d3-ade3-48ffca0ce119", alterId=0, over-tls=true, transport=ws, path=/ws, host=cdn.example.test
Trojan 示例 = trojan, node.example.test, 443, "example", transport=tcp, sni=tls.example.test, skip-cert-verify=false, alpn="h2,http/1.1"

[Proxy Group]
代理 = select, SS 示例, VMess 示例, Trojan 示例

[Rule]
DOMAIN,ads.example.test,REJECT
DOMAIN-SUFFIX,example.test,代理
IP-CIDR,192.0.2.0/24,DIRECT,no-resolve
FINAL,代理
